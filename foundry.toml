[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/"
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin = "${CREDITCOIN_RPC_URL}"
